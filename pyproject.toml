[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "0.1.0"
description = "End-to-end movie recommender: baselines, two-tower retrieval, LightGBM ranking, real-time serving."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
# Installed phase by phase so each phase only pulls what it needs.
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.8", "matplotlib>=3.8", "jupyter>=1.0", "fakeredis>=2.20", "httpx>=0.27"]
train = ["torch>=2.2", "scikit-learn>=1.4", "implicit>=0.7.2", "faiss-cpu>=1.8", "lightgbm>=4.3", "mlflow>=2.12"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "redis>=5.0", "torch>=2.2", "lightgbm>=4.3", "lleaves>=1.3", "llvmlite>=0.36,<0.45"]
loadtest = ["locust>=2.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
