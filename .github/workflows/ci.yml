name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[train,serve,dev]"
      - name: Lint
        run: |
          ruff check src tests loadtest
          ruff format --check src tests loadtest
      - name: Tests
        # Tests that need the downloaded dataset or built artifacts (real-data parity,
        # HTTP API on the real bundle) skip themselves when those are absent.
        run: pytest -q
